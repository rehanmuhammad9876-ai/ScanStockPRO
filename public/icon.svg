
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <radialGradient id="lens" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="35%" stop-color="#0891b2"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Scan corners -->
  <g fill="none" stroke="#6ee7b7"
     stroke-width="19" stroke-linecap="round">
    <path d="M105 170 V105 H170"/>
    <path d="M342 105 H407 V170"/>
    <path d="M105 342 V407 H170"/>
    <path d="M342 407 H407 V342"/>
  </g>

  <!-- Letter S -->
  <path d="M370 155
           C325 105 175 105 145 190
           C105 295 365 235 365 330
           C365 410 220 430 140 365"
        fill="none"
        stroke="url(#s)"
        stroke-width="76"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Camera lens -->
  <circle cx="256" cy="256" r="91"
          fill="#022c22"
          stroke="#a7f3d0"
          stroke-width="13"/>

  <circle cx="256" cy="256" r="72"
          fill="#0f172a"
          stroke="#34d399"
          stroke-width="8"/>

  <circle cx="256" cy="256" r="57"
          fill="url(#lens)"
          stroke="#64748b"
          stroke-width="5"/>

  <circle cx="256" cy="256" r="30"
          fill="#020617"
          stroke="#67e8f9"
          stroke-width="5"/>

  <circle cx="238" cy="236" r="12"
          fill="#ffffff" opacity=".85"/>

  <circle cx="285" cy="229" r="6"
          fill="#ffffff" opacity=".8"/>

</svg>
